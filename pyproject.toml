[project]
name = "rotasul-assistente-rh"
version = "0.1.0"
description = "Assistente que responde perguntas de funcionários com base nas políticas oficiais de RH, citando a fonte."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.6",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rotasul_rh"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "watchfiles>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes de integração falam com o Postgres e o Ollama de verdade e levam cerca de 1 minuto.
# Rodam só quando pedidos: uv run pytest -m integracao
addopts = "-m 'not integracao'"
markers = ["integracao: precisa do Postgres (Docker) e do Ollama rodando"]
# Aviso interno do Starlette sobre o cliente de testes; não vem do código do projeto.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
