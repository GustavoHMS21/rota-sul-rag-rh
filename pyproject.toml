[project]
name = "rotasul-assistente-rh"
version = "0.1.0"
description = "Assistente que responde perguntas de funcionários com base nas políticas oficiais de RH, citando a fonte."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rotasul_rh"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
